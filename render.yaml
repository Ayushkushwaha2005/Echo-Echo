# ==========================================================================
# ECHO ECHO — API service on Render (free plan).
#
# The API is a long-running Fastify process: it holds a PostgreSQL pool and
# runs the sweeper and the settlement scheduler in-process. That is why it
# is here and not on a serverless host; nothing about the application is
# adapted to the platform.
#
# Every secret is `sync: false` (entered in the Render dashboard, never in
# Git) or `generateValue: true` (Render generates it and nobody, including
# this repository, ever sees it).
# ==========================================================================
services:
  - type: web
    name: echo-echo-api
    runtime: docker
    plan: free
    # Co-located with the database, NOT with the users. The Neon project is
    # in AWS us-east-1, and an API request runs several queries: putting the
    # service near the students (singapore) would pay a trans-Pacific round
    # trip per query, which costs far more than the single ocean crossing
    # the browser already makes. Move both together or neither.
    region: virginia
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    # /health is liveness only and does NOT touch the database, so Render's
    # probe cannot keep the free Neon compute awake and burn its CU quota.
    healthCheckPath: /health
    # Deploys come from .github/workflows/deploy.yml, which runs only after CI
    # passes and then proves the new commit is live. Render's own trigger is
    # off so a push is never deployed twice, once of them untested.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # Matches EXPOSE and the HEALTHCHECK in server/Dockerfile, so the
      # container's own probe and Render's agree on one port.
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0

      # ---- database (Neon) ------------------------------------------------
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      # Neon Free allows few connections and suspends after 5 idle minutes.
      # A small pool that closes idle connections is what lets it scale down.
      - key: PG_POOL_MAX
        value: 5
      - key: PG_IDLE_TIMEOUT_MS
        value: 30000

      # ---- session and administrator cryptography -------------------------
      # Generated by Render. They are never printed, committed, or known to
      # anyone; the boot guard requires both to be at least 32 characters.
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_TOTP_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: true
      # Render terminates TLS and forwards X-Forwarded-For. Without this every
      # request shares one IP, which collapses per-IP rate limits and audit IPs.
      - key: TRUST_PROXY
        value: true

      # ---- origin --------------------------------------------------------
      # The browser only ever sees the Vercel origin: /api/* is rewritten to
      # this service, so the SameSite=Lax session cookie is same-site and the
      # CSRF origin check in src/index.js sees exactly this value.
      - key: WEB_ORIGIN
        value: https://echo-echo-nu.vercel.app
      - key: WEBAUTHN_RP_ID
        value: echo-echo-nu.vercel.app
      - key: WEBAUTHN_ORIGINS
        value: https://echo-echo-nu.vercel.app

      # ---- who owns the platform ------------------------------------------
      - key: PLATFORM_OWNER_EMAIL
        value: ayush.17551@stu.upes.ac.in
      - key: STUDENT_EMAIL_DOMAINS
        value: stu.upes.ac.in
      # Administrator powers always require a passkey. The boot guard refuses
      # production if this is off; it is stated here so it cannot drift.
      - key: ADMIN_PASSKEY_REQUIRED
        value: true

      # ---- email (Brevo) ---------------------------------------------------
      # Brevo delivers to any recipient from ONE verified sender address, with
      # no domain to own. Live since 24 Sep 2026: a real code reached a
      # @stu.upes.ac.in mailbox and verified. EMAIL_FROM is that verified
      # sender - NOT a @stu.upes.ac.in address, whose DMARC p=quarantine
      # would junk mail Brevo sends in its name.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Resend needs a verified domain to mail anyone but its account holder;
      # kept only so switching back is one variable.
      - key: RESEND_API_KEY
        sync: false

      # ---- private object storage (Backblaze B2, S3-compatible) ------------
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # ---- deferred payments ----------------------------------------------
      # No gateway yet: checkout returns 503 and no order is created. This is
      # an acknowledged state, not a fallback that fakes a payment.
      - key: PAYMENTS_DEFERRED
        value: true
      # With no orders to sweep, the 30s sweeper would only keep Neon's free
      # compute awake around the clock and exhaust the monthly CU quota.
      # Turn this back on in the same change that removes PAYMENTS_DEFERRED.
      - key: SWEEPER
        value: "off"

      - key: LOG_LEVEL
        value: info
