# ===========================================================================
# ECHO ECHO — CI
#
# Everything here runs with NO credentials and NO external service. That is
# deliberate: a pipeline that needs a secret cannot run on a pull request,
# and one that quietly skips when a secret is absent tells you nothing.
#
#   build      the production surface bundle, including its audit (which is
#              what keeps a demo password or a hardcoded OTP out of dist/)
#   test       the full server suite against REAL PostgreSQL binaries, so
#              foreign keys, partial unique indexes and transaction
#              semantics are exercised rather than asserted
#   workflows  every workflow in this directory parses as YAML
#
# The API base used for the build check is a placeholder host. It never
# reaches a deployment; it exists so the production path of build.mjs
# (including the https and forbidden-content checks) is what CI runs.
# ===========================================================================
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Production build (separate https origin)
        run: QUAD_API_BASE=https://api.example.invalid node build.mjs --production

      # Last, so the QA and smoke steps below inspect the bundle Vercel
      # actually deploys (the Vercel project sets QUAD_API_BASE=/api). The
      # CSP check in frontend-qa rightly refuses a cross-origin API base:
      # vercel.json's connect-src allows only this origin.
      - name: Production build (same-origin path prefix, as deployed)
        run: QUAD_API_BASE=/api node build.mjs --production

      # What a browser would catch and this cannot is rendered layout. What
      # it does catch without a browser is the decidable half: an
      # unresolvable asset, a box wider than a phone, a missing viewport, an
      # API key in a bundle.
      - name: Static QA of the built surfaces
        run: node tools/frontend-qa.mjs

      - name: Every surface executes and renders
        run: node tests/bundle-smoke.mjs

      # The campus map loads late; a page must still only ever run modules
      # from its own deployment, across a deploy.
      - name: Every page preloads its own deployment's modules
        run: node tests/asset-version.mjs

      # Photo URLs are resolved at runtime, so the static QA cannot see them.
      # This renders the café and dish frames from dist/ and checks each file.
      - name: Every café and dish photo the site renders ships with it
        run: node tests/media-paths.mjs

      # The build must REFUSE these, so a misconfigured deployment fails in
      # CI rather than shipping a bundle that calls a developer's laptop.
      - name: An unset or insecure API base fails the build
        run: |
          set -euo pipefail
          if node build.mjs --production > /dev/null 2>&1; then
            echo "::error::build.mjs accepted an unset QUAD_API_BASE"; exit 1
          fi
          if QUAD_API_BASE=http://insecure.example node build.mjs --production > /dev/null 2>&1; then
            echo "::error::build.mjs accepted a plain-http QUAD_API_BASE"; exit 1
          fi
          echo "Both rejected, as they must be."

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # initdb is slow and is a one-time cost per runner. Kept as its own
      # step so a cluster that fails to come up is not reported as a test
      # failure, which would send you looking in the wrong place.
      - name: Create the PostgreSQL cluster
        working-directory: server
        run: npm run test:init

      - name: Test
        working-directory: server
        run: npm test

  # Real browser journeys against the production bundle, the real API and a
  # disposable PostgreSQL, with synthetic data and a stub in place of email.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server dependencies
        working-directory: server
        run: npm ci
      - name: Build the bundle
        run: QUAD_API_BASE=/api node build.mjs --production
      - name: Browser tools
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Prepare the test database
        working-directory: server
        run: node test/helpers/db.mjs init
      - name: Journeys
        working-directory: tests/browser
        run: |
          node harness.mjs > harness.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/api/health > /dev/null && break; sleep 2; done
          npx playwright test --config playwright.config.mjs

  # A release, rehearsed with nothing real: the production image, an upgrade from the
  # schema production runs today, a timed dump and restore, the app started on the
  # restored database, and the previous release started on the new schema, which is
  # what a rollback relies on. Synthetic data and throwaway databases only.
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: rehearsal-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: rehearsal-only-not-a-secret
      OLD: postgres://postgres:rehearsal-only-not-a-secret@localhost:5432/rehearsal
      NEW: postgres://postgres:rehearsal-only-not-a-secret@localhost:5432/restored
      PREVIOUS_RELEASE: '4abff7a'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL 18 client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: The production image builds, and sharp works inside it
        run: |
          set -euo pipefail
          docker build -t echo-api server
          docker run --rm echo-api node -e "import('sharp').then(async ({default:s})=>{const b=await s({create:{width:4,height:4,channels:3,background:'red'}}).webp().toBuffer();if(!b.length)process.exit(1);console.log('sharp works in the image')})"
      - name: Upgrade from the previous release's schema, with its data in place
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -c 'CREATE DATABASE rehearsal' -c 'CREATE DATABASE restored'
          git worktree add -q ../previous "$PREVIOUS_RELEASE"
          (cd ../previous/server && npm ci --no-audit --no-fund > /dev/null)
          (cd ../previous/server && DATABASE_URL="$OLD" DB_SSL=false PLATFORM_OWNER_PHONE=+919000000000 NODE_ENV=rehearsal node src/db/migrate.js | tail -2)
          (cd ../previous/server && DATABASE_URL="$OLD" DB_SSL=false PLATFORM_OWNER_PHONE=+919000000000 NODE_ENV=rehearsal node src/db/seed.js | tail -2)
          psql "$OLD" -Atc "SELECT count(*) FROM schema_migration" > before-migrations.txt
          psql "$OLD" -AtF' ' -c "SELECT 'vendor', count(*) FROM vendor UNION ALL SELECT 'menu_item', count(*) FROM menu_item UNION ALL SELECT 'app_user', count(*) FROM app_user" > before.txt
          docker run --rm --network host -e NODE_ENV=rehearsal -e DATABASE_URL="$OLD" -e DB_SSL=false -e PLATFORM_OWNER_PHONE=+919000000000 echo-api node src/db/migrate.js | tail -8
          psql "$OLD" -AtF' ' -c "SELECT 'vendor', count(*) FROM vendor UNION ALL SELECT 'menu_item', count(*) FROM menu_item UNION ALL SELECT 'app_user', count(*) FROM app_user" > after.txt
          diff before.txt after.txt
          echo "migrations $(cat before-migrations.txt) -> $(psql "$OLD" -Atc 'SELECT count(*) FROM schema_migration'), row counts unchanged"
      - name: Dump and restore, timed
        run: |
          set -euo pipefail
          s=$(date +%s); pg_dump "$OLD" -Fc -f rehearsal.dump; d=$(date +%s)
          pg_restore --no-owner --no-privileges --dbname="$NEW" rehearsal.dump; r=$(date +%s)
          [ "$(psql "$OLD" -Atc 'SELECT count(*) FROM schema_migration')" = "$(psql "$NEW" -Atc 'SELECT count(*) FROM schema_migration')" ]
          echo "dump $((d-s)) s, restore $((r-d)) s (synthetic data, so small)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The image starts on the restored database and serves
        run: |
          set -euo pipefail
          s=$(date +%s)
          docker run -d --name api --network host -e NODE_ENV=rehearsal -e PORT=8080 -e DATABASE_URL="$NEW" -e DB_SSL=false -e SWEEPER=off \
            -e COOKIE_SECRET=rehearsal-secret-at-least-32-characters-long -e ADMIN_TOTP_KEY=rehearsal-totp-key-0123456789abcdef \
            -e PLATFORM_OWNER_PHONE=+919000000000 -e WEB_ORIGIN=http://localhost:3000 echo-api
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/health > /dev/null || { docker logs api | tail -30; exit 1; }
          echo "started in $(( $(date +%s)-s )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s -o /dev/null -w 'ready %{http_code}\n' http://localhost:8080/ready
          curl -sf http://localhost:8080/vendors > /dev/null
          docker rm -f api > /dev/null
      - name: Rollback, the previous release runs on the new schema
        working-directory: ../previous/server
        run: |
          set -euo pipefail
          NODE_ENV=rehearsal PORT=8081 DATABASE_URL="$NEW" DB_SSL=false SWEEPER=off COOKIE_SECRET=rehearsal-secret-at-least-32-characters-long \
            ADMIN_TOTP_KEY=rehearsal-totp-key-0123456789abcdef PLATFORM_OWNER_PHONE=+919000000000 WEB_ORIGIN=http://localhost:3000 node src/index.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8081/health > /dev/null || { tail -30 api.log; exit 1; }
          curl -sf http://localhost:8081/vendors > /dev/null
          vendor=$(curl -sf http://localhost:8081/vendors | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const a=j.vendors||j;console.log(a[0]?.id||"")})')
          [ -z "$vendor" ] || curl -sf "http://localhost:8081/vendors/$vendor/menu" > /dev/null
          echo "the previous release serves on the new schema" | tee -a "$GITHUB_STEP_SUMMARY"

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # render.yaml is joined to this check because it is deployment
      # configuration that nothing else validates: a typo in it does not
      # surface until a deploy is attempted, which is the worst moment.
      - name: Every workflow parses
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml .github/workflows/*.yaml render.yaml; do
            [ -e "$f" ] || continue
            npx --yes js-yaml@4.1.0 "$f" > /dev/null
            echo "ok  $f"
          done
