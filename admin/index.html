<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3F6">
<title>ECHO ECHO ADMIN</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The web fonts are not allowed to hold the first paint: text shows in the
     fallback face and swaps when they arrive (display=swap). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400..800&family=DM+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Manrope:wght@400..800&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="../packages/design-system/tokens.css">
<link rel="stylesheet" href="../packages/design-system/components.css">
<link rel="stylesheet" href="../packages/design-system/web.css">
<link rel="stylesheet" href="../packages/design-system/chat.css">
<link rel="stylesheet" href="../packages/design-system/admin.css">
<!-- V5 Liquid Glass: admin-only presentation layer, loaded last. -->
<link rel="stylesheet" href="../packages/design-system/admin-glass.css">
<script>
/* API base. In production the server injects this; locally it defaults to
   the dev server. Nothing secret is ever placed here — the only secrets in
   this product live in server environment variables. */
window.QUAD_API_BASE = window.QUAD_API_BASE || 'http://localhost:8080';
</script>
</head>
<body>
<!-- V5 Liquid Glass: the scene behind the glass (V1's colours in soft bands) and
     the refraction filter the glass bends it with. Decorative only. -->
<div class="v5-scene" aria-hidden="true">
  <svg viewBox="0 0 1440 1000" preserveAspectRatio="xMidYMid slice" focusable="false">
    <defs>
      <filter id="v5-soft-wide" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
      <filter id="v5-soft-line" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <g filter="url(#v5-soft-wide)" fill="none" stroke-linecap="round">
      <path d="M-120 330 C 180 220, 420 260, 760 120 S 1300 -40, 1600 40" style="stroke:var(--v5-rib-rose)" stroke-width="170"/>
      <path d="M-160 620 C 220 520, 560 600, 900 430 S 1380 240, 1620 280" style="stroke:var(--v5-rib-lo)" stroke-width="120"/>
      <path d="M-120 520 C 260 420, 600 470, 940 320 S 1420 140, 1640 160" style="stroke:var(--v5-rib-lilac)" stroke-width="150"/>
      <path d="M-140 900 C 260 800, 620 860, 980 700 S 1420 520, 1640 560" style="stroke:var(--v5-rib-coral)" stroke-width="190"/>
      <path d="M-140 760 C 240 660, 600 720, 960 560 S 1400 380, 1640 420" style="stroke:var(--v5-rib-rose)" stroke-width="110"/>
    </g>
    <g filter="url(#v5-soft-line)" fill="none" stroke-linecap="round">
      <path d="M-120 430 C 230 330, 560 380, 900 230 S 1380 60, 1620 90" style="stroke:var(--v5-rib-hi)" stroke-width="10"/>
      <path d="M-140 690 C 240 590, 590 650, 940 490 S 1400 300, 1630 340" style="stroke:var(--v5-rib-hi)" stroke-width="8"/>
      <path d="M-140 840 C 250 740, 610 800, 970 630 S 1410 450, 1640 490" style="stroke:var(--v5-rib-hi)" stroke-width="7"/>
    </g>
  </svg>
</div>
<svg class="v5-filters" aria-hidden="true" focusable="false">
  <filter id="lg-refract" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="56" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="app"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
